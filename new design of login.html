<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - Split Glass Design</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100%;
      font-family: 'Inter', sans-serif;
      color: #ffffff;
    }

    /* Full-Screen Background Image */
    .page-wrapper {
      display: flex;
      min-height: 100vh;
      width: 100%;
      background: linear-gradient(rgba(15, 23, 30, 0.35), rgba(15, 23, 30, 0.45)),
                  url('https://unsplash.com') center/cover no-repeat;
    }

    /* Left Clear Panel */
    .left-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px 6% 40px 5%;
    }

    .left-panel h1 {
      font-size: 38px;
      font-weight: 600;
      line-height: 1.2;
      margin-bottom: 16px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
    }

    .left-panel p {
      font-size: 15px;
      line-height: 1.55;
      color: rgba(255, 255, 255, 0.9);
      max-width: 390px;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
    }

    /* Right Frosted Glass Panel */
    .right-panel {
      flex: 1;
      background: rgba(18, 24, 32, 0.55);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 50px 8%;
    }

    .form-container {
      width: 100%;
      max-width: 420px;
    }

    .form-container h2 {
      font-size: 32px;
      font-weight: 500;
      margin-bottom: 36px;
      letter-spacing: 0.3px;
    }

    /* Underlined Input Fields */
    .input-group {
      position: relative;
      margin-bottom: 32px;
      border-bottom: 1.5px solid rgba(255, 255, 255, 0.7);
      display: flex;
      align-items: center;
      padding-bottom: 8px;
      transition: border-color 0.25s ease;
    }

    .input-group:focus-within {
      border-bottom-color: #ffffff;
    }

    .input-group input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 15px;
      padding-right: 30px;
    }

    .input-group input::placeholder {
      color: rgba(255, 255, 255, 0.65);
    }

    .input-icon {
      width: 18px;
      height: 18px;
      fill: rgba(255, 255, 255, 0.8);
      flex-shrink: 0;
    }

    /* Terms Checkbox Row */
    .terms-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 34px;
    }

    .terms-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #ffffff;
      cursor: pointer;
    }

    .terms-row a {
      color: #ffffff;
      text-decoration: none;
      font-weight: 500;
    }
    .terms-row a:hover {
      text-decoration: underline;
    }

    /* Bottom Action Row */
    .action-row {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .btn-pill {
      background: transparent;
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      color: #ffffff;
      padding: 9px 26px;
      border-radius: 50px;
      font-size: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .btn-pill:hover {
      background: #ffffff;
      color: #111827;
    }

    .login-link {
      color: rgba(255, 255, 255, 0.85);
      font-size: 13.5px;
      text-decoration: underline;
      text-underline-offset: 4px;
    }
    .login-link:hover {
      color: #ffffff;
    }

    /* Mobile Responsiveness */
    @media (max-width: 768px) {
      .page-wrapper {
        flex-direction: column;
      }
      .left-panel {
        padding: 40px 24px 20px;
      }
      .right-panel {
        padding: 36px 24px 50px;
      }
    }
  </style>
</head>
<body>

  <div class="page-wrapper">
    <!-- Left Info Section -->
    <div class="left-panel">
      <h1>Don't Have An<br>Account?</h1>
      <p>Register to access all the features of our service. Manage your business in one place. It's free!</p>
    </div>

    <!-- Right Frosted Glass Form -->
    <div class="right-panel">
      <div class="form-container">
        <h2>Sign Up</h2>
        <form onsubmit="event.preventDefault(); alert('Account Created!');">
          
          <div class="input-group">
            <input type="email" placeholder="Email" required />
            <svg class="input-icon" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>
          </div>

          <div class="input-group">
            <input type="text" placeholder="Username" required />
            <svg class="input-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10h5v-2h-5c-4.34 0-8-3.66-8-8s3.66-8 8-8 8 3.66 8 8v1.43c0 .79-.71 1.57-1.5 1.57s-1.5-.78-1.5-1.57V12c0-2.76-2.24-5-5-5s-5 2.24-5 5 2.24 5 5 5c1.38 0 2.64-.56 3.54-1.47.65.89 1.77 1.47 2.96 1.47 1.97 0 3.5-1.6 3.5-3.57V12c0-5.52-4.48-10-10-10zm0 13c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3z"/></svg>
          </div>

          <div class="input-group">
            <input type="password" placeholder="Password" required />
            <svg class="input-icon" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
          </div>

          <label class="terms-row">
            <input type="checkbox" required />
            <span>I Agree To <a href="#">Terms</a> And <a href="#">Conditions Of Service</a></span>
          </label>

          <div class="action-row">
            <button type="submit" class="btn-pill">Sign Up <span>&rsaquo;</span></button>
            <a href="#" class="login-link">Have An Account?</a>
          </div>

        </form>
      </div>
    </div>
  </div>

</body>
</html>
